name: Scan crypto trend setups

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-trend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEISHU_TREND_WEBHOOK: ${{ secrets.FEISHU_TREND_WEBHOOK }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run top-300 scan
        run: python scanner.py

      - name: Save deduplication state
        run: |
          if git diff --quiet -- state.json; then
            echo "No new alert state"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update alert state [skip ci]"
          git push

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result-${{ github.run_id }}
          path: latest_results.json
          if-no-files-found: warn
          retention-days: 14
