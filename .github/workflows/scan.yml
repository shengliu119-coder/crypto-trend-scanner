name: Scan crypto trend setups

on:
  workflow_dispatch:
    inputs:
      test_feishu:
        description: "Send a Feishu connection test before scanning"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: crypto-trend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEISHU_TREND_WEBHOOK: ${{ secrets.FEISHU_TREND_WEBHOOK }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Feishu connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_feishu }}
        run: |
          test -n "$FEISHU_TREND_WEBHOOK"
          response=$(curl --fail-with-body --silent --show-error             -X POST "$FEISHU_TREND_WEBHOOK"             -H "Content-Type: application/json; charset=utf-8"             --data '{"msg_type":"text","content":{"text":"✅ GitHub 云端加密趋势扫描器已成功连接飞书。"}}')
          echo "$response" | python -c "import json,sys; r=json.load(sys.stdin); assert r.get('code') == 0, r"

      - name: Run top-300 scan
        run: python scanner.py

      - name: Save deduplication state
        run: |
          if git diff --quiet -- state.json; then
            echo "No new alert state"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update alert state [skip ci]"
          git push

      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result-${{ github.run_id }}
          path: latest_results.json
          if-no-files-found: warn
          retention-days: 14
